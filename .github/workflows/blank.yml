name: Unzip prisma
on: push
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: unzip backend.zip && rm prisma.zip
      - run: git config user.email "you@example.com"
      - run: git config user.name "GitHub Actions"
      - run: git add . && git commit -m "Extract backend files" && git push
